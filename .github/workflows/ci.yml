name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      # Qt without a display (the viewer tests render offscreen, PORT-PLAN §4 M2).
      QT_QPA_PLATFORM: offscreen
      # The proprietary vendor package is never available in CI: point the src_dir fixture at a
      # path that does not exist so every SRC-dependent test skips (tests/conftest.py).
      NEXCUT_SRC: /nonexistent/Mlaser-v0.0.0.52
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System libraries for headless PySide6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libx11-6
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,gui]'
      - name: Lint
        run: ruff check . tools/m1_session.py
      - name: Qt smoke
        run: python -c "from PySide6.QtWidgets import QApplication; QApplication([]); print('Qt offscreen OK')"
      - name: Test
        run: pytest -q
