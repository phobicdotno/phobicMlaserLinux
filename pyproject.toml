[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexcut"
version = "0.0.1"
description = "Native Linux reimplementation of the Mlaser/NexCut laser-cutter software (MCC100 card)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
nexcut-mccd = "nexcut.mccd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexcut = ["py.typed", "core/schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# tools/ holds pre-existing standalone scripts (chf_parse.py is validated on all
# samples and will be promoted into io/chf.py in M0); lint them once they move.
extend-exclude = [".scratch", ".venv", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
